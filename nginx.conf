# /etc/nginx/sites-available/cybershield
#
# CyberShield nginx config
# - Serve React dist/ on port 80
# - Proxy /api/ and /ws/ to FastAPI port 8000
# - Block /internal/ from outside (sensor IPC via localhost only)

server {
    listen 80;
    server_name _;

    # === Serve React build ===
    root /path/to/cybershield/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # === Proxy REST API to FastAPI ===
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # === Proxy WebSocket (Detection Feed) ===
    # ต้องมี Upgrade + Connection headers สำหรับ WebSocket
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # === Block internal endpoint จากภายนอก ===
    # Sensors เข้าถึง /internal/ ผ่าน localhost เท่านั้น
    location /internal/ {
        deny all;
    }
}
